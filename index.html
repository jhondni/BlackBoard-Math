<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lousa Online - Matemática</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/toolbar.css">
    <link rel="stylesheet" href="css/board.css">
</head>
<body>

    <header class="header">
        <h1 class="header__title">Lousa Online</h1>
        <div class="header__actions">
            <button id="btn-save" class="header__btn" title="Salvar">Salvar</button>
            <button id="btn-load" class="header__btn" title="Carregar">Carregar</button>
            <button id="btn-clear" class="header__btn header__btn--danger" title="Limpar Lousa">Limpar</button>
        </div>
    </header>

    <div class="app">
        <aside class="toolbar" id="toolbar">
            <button class="toolbar__btn toolbar__btn--active" data-tool="select" title="Selecionar (V)">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
                    <path d="M13 13l6 6"/>
                </svg>
            </button>
            <button class="toolbar__btn" data-tool="math" title="Equação LaTeX (E)">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <text x="3" y="18" font-size="16" font-family="serif" fill="currentColor" stroke="none">fx</text>
                </svg>
            </button>
            <button class="toolbar__btn" data-tool="text" title="Texto (T)">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="4 7 4 4 20 4 20 7"/>
                    <line x1="12" y1="4" x2="12" y2="20"/>
                    <line x1="8" y1="20" x2="16" y2="20"/>
                </svg>
            </button>
            <button class="toolbar__btn" data-tool="image" title="Imagem SVG (I)">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
            </button>
            <div class="toolbar__separator"></div>
            <button class="toolbar__btn" data-tool="triangle" title="Triângulo">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="12,3 22,21 2,21"/>
                </svg>
            </button>
            <button class="toolbar__btn" data-tool="circle" title="Círculo">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="9"/>
                </svg>
            </button>
            <button class="toolbar__btn" data-tool="rectangle" title="Retângulo">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="4" y="4" width="16" height="16" rx="1"/>
                </svg>
            </button>
        </aside>

        <main class="board-container">
            <div class="board" id="board">
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <div class="modal__header">
                <h2 class="modal__title" id="modal-title">Editor</h2>
                <button class="modal__close" id="modal-close">&times;</button>
            </div>
            <div class="modal__body">
                <label class="modal__label" id="modal-label" for="modal-input">Expressão LaTeX:</label>
                <textarea class="modal__input" id="modal-input" rows="3" placeholder="Ex: \frac{-b \pm \sqrt{b^2-4ac}}{2a}"></textarea>
                <div class="modal__preview" id="modal-preview"></div>
            </div>
            <div class="modal__footer">
                <button class="modal__btn modal__btn--cancel" id="modal-cancel">Cancelar</button>
                <button class="modal__btn modal__btn--confirm" id="modal-confirm">Confirmar</button>
            </div>
        </div>
    </div>

    <div class="context-menu" id="context-menu">
        <button class="context-menu__item" data-action="edit">Editar</button>
        <button class="context-menu__item" data-action="duplicate">Duplicar</button>
        <button class="context-menu__item" data-action="bring-front">Trazer para frente</button>
        <button class="context-menu__item" data-action="send-back">Enviar para trás</button>
        <hr class="context-menu__separator">
        <button class="context-menu__item context-menu__item--danger" data-action="delete">Excluir</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <script src="js/models/BoardObject.js"></script>
    <script src="js/models/MathObject.js"></script>
    <script src="js/models/TextObject.js"></script>
    <script src="js/models/ImageObject.js"></script>

    <script src="js/board/Board.js"></script>

    <script src="js/renderers/Renderer.js"></script>
    <script src="js/renderers/MathRenderer.js"></script>
    <script src="js/renderers/TextRenderer.js"></script>
    <script src="js/renderers/SVGRenderer.js"></script>

    <script src="js/controllers/MouseController.js"></script>
    <script src="js/controllers/KeyboardController.js"></script>
    <script src="js/controllers/BoardController.js"></script>

    <script src="js/app.js"></script>
</body>
</html>
